name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run backend tests
        working-directory: backend
        run: node --test

  android:
    name: Core tests and debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - name: Install Android 35 SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and test
        id: build
        run: |
          set +e
          {
            echo "===== core test ====="
            gradle :core:test --no-daemon --stacktrace
            echo "CORE_EXIT:$?"
            echo "===== app unit test ====="
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
            echo "APP_TEST_EXIT:$?"
            echo "===== assemble ====="
            gradle :app:assembleDebug --no-daemon --stacktrace
            echo "APK_EXIT:$?"
          } > /tmp/build.log 2>&1
          code=$?
          tail -n 160 /tmp/build.log
          python3 - << 'PY'
          import os
          text = open("/tmp/build.log", encoding="utf-8", errors="replace").read()
          interesting = []
          for line in text.splitlines():
              if any(token in line for token in ("e: ", "FAILED", "AssertionError", "What went wrong", "Execution failed", "error:", "CORE_EXIT", "APP_TEST_EXIT", "APK_EXIT")):
                  interesting.append(line)
          excerpt = "\n".join(interesting[-80:]) or "\n".join(text.splitlines()[-50:])
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              open(summary, "a", encoding="utf-8").write("```\n" + excerpt[:8000] + "\n```\n")
          failed = not ("CORE_EXIT:0" in text and "APP_TEST_EXIT:0" in text and "APK_EXIT:0" in text)
          if failed:
              for line in excerpt.splitlines()[:30]:
                  safe = line.replace("%", "%25").replace("\r", "")[:300]
                  print(f"::error::{safe}")
          open("/tmp/excerpt.txt", "w", encoding="utf-8").write(excerpt[:6000])
          PY
          if grep -q "CORE_EXIT:0" /tmp/build.log && grep -q "APP_TEST_EXIT:0" /tmp/build.log && grep -q "APK_EXIT:0" /tmp/build.log; then
            exit 0
          fi
          exit 1
      - name: Publish failure excerpt
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PY'
          text = open("/tmp/excerpt.txt", encoding="utf-8", errors="replace").read()
          open("/tmp/comment.md", "w", encoding="utf-8").write("Build excerpt:\n```\n" + text[:5500] + "\n```\n")
          PY
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --raw-field body="$(cat /tmp/comment.md)" >/dev/null
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inkproof-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
