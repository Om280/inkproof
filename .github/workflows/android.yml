name: Build & Test

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backend tests
        working-directory: backend
        run: npm test

  android:
    name: Android unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee /tmp/tests.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/build.log

      - name: Publish failure details to summary
        if: failure()
        run: |
          {
            echo '## Failure details'
            echo '```'
            for f in /tmp/tests.log /tmp/build.log; do
              [ -f "$f" ] && grep -E "^e: |error:|FAILED|Caused by|What went wrong|Execution failed|Unresolved|Test .* FAILED" -A 3 "$f" | head -c 50000
            done
            echo
            echo '--- test case failures ---'
            find app/build/test-results -name '*.xml' 2>/dev/null | while read -r x; do
              if grep -q '<failure' "$x"; then
                echo "FILE: $x"
                grep -oE '<testcase name="[^"]*"' "$x" | head -5
                grep -A 6 '<failure' "$x" | head -c 4000
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: inkproof-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
